name: android
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: CI-sized Gradle settings (override the low-memory project defaults)
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=4
          org.gradle.parallel=true
          kotlin.daemon.jvmargs=-Xmx2g
          EOF
      - name: Keystore (WD_KEYSTORE_BASE64 secret, else an ephemeral key; never committed)
        env:
          WD_KEYSTORE_BASE64: ${{ secrets.WD_KEYSTORE_BASE64 }}
          SP: ${{ secrets.WD_STORE_PASSWORD }}
          KA: ${{ secrets.WD_KEY_ALIAS }}
          KP: ${{ secrets.WD_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/wd.jks"
          if [ -n "$WD_KEYSTORE_BASE64" ]; then
            echo "$WD_KEYSTORE_BASE64" | base64 -d > "$KS"
            { echo "WD_STORE_PASSWORD=$SP"; echo "WD_KEY_ALIAS=$KA"; echo "WD_KEY_PASSWORD=$KP"; echo "WD_SIGNATURE=release"; } >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -hex 16)
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -alias wd -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$PW" -keypass "$PW" -dname "CN=W Design CI ephemeral"
            { echo "WD_STORE_PASSWORD=$PW"; echo "WD_KEY_ALIAS=wd"; echo "WD_KEY_PASSWORD=$PW"; echo "WD_SIGNATURE=ephemeral"; } >> "$GITHUB_ENV"
          fi
          echo "WD_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
      - name: Tests + release build (MtzDemoTest writes core/mtz/build/demo.mtz)
        run: ./gradlew --stacktrace :core:model:test :core:format:test :core:mtz:test assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk W-Design.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs W-Design.apk
          "$BT/aapt2" dump badging W-Design.apk | head -20
          unzip -l W-Design.apk | grep -E 'classes[0-9]*\.dex'
          echo "$WD_SIGNATURE" > signature.txt
          ls -la W-Design.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            W-Design.apk
            signature.txt
            core/mtz/build/demo.mtz
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r W-Design.apk
            adb shell am start -W -n com.wdesign.studio/.MainActivity
            sleep 5
            mkdir -p shots
            for s in home discover create designs settings studio-demo lockscreen-demo xiaomilab; do adb shell am start -W -a android.intent.action.VIEW -d "wdesign://open/$s" -p com.wdesign.studio; sleep 4; adb exec-out screencap -p > "shots/$s.png"; done
            adb shell dumpsys activity top | head -50 > shots/activity-top.txt
            adb shell monkey -p com.wdesign.studio --pct-syskeys 0 --throttle 150 -s 42 -v 1500 > shots/monkey.txt 2>&1 || true
            tail -5 shots/monkey.txt
            adb logcat -d > shots/logcat.txt
            for f in shots/*.png; do test -s "$f" || { echo "empty screenshot $f"; exit 1; }; done
            if grep -A3 "FATAL EXCEPTION" shots/logcat.txt | grep -q "com.wdesign.studio"; then grep -A40 "FATAL EXCEPTION" shots/logcat.txt; exit 1; fi
            adb uninstall com.wdesign.studio || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r com.wdesign.studio.test/androidx.test.runner.AndroidJUnitRunner > shots/instrument.txt 2>&1 || true
            grep -E "INSTRUMENTATION_STATUS: (test|stack)=|OK \(|FAILURES|Process crashed|Tests run" shots/instrument.txt | tail -40
            adb logcat -d > shots/logcat-instrument.txt
            if grep -qE "FAILURES!!!|Process crashed|INSTRUMENTATION_FAILED" shots/instrument.txt; then grep -A40 "FATAL EXCEPTION" shots/logcat-instrument.txt | head -80; exit 1; fi
            grep -q "^OK (" shots/instrument.txt || { echo "instrumentation did not report OK"; tail -30 shots/instrument.txt; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots }

  publish:
    needs: smoke
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk, path: '${{ runner.temp }}/apk' }
      - uses: actions/download-artifact@v4
        with: { name: screenshots, path: '${{ runner.temp }}/shots' }
      - name: Commit W-Design.apk to the branch root
        run: |
          cp "$RUNNER_TEMP/apk/W-Design.apk" W-Design.apk
          mkdir -p docs/screenshots && cp "$RUNNER_TEMP"/shots/*.png docs/screenshots/
          echo "SIG=$(cat "$RUNNER_TEMP/apk/signature.txt")" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f W-Design.apk docs/screenshots
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Add W-Design.apk build [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "Nothing changed"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: W Design 1.0.0
          target_commitish: ${{ github.ref_name }}
          files: W-Design.apk
          body: |
            W Design 1.0.0 for Android 8.0+ (minSdk 26, target 35).
            Signature: ${{ env.SIG }}. "ephemeral" means a throwaway CI key: a later build will not install over this one without uninstalling. Add the WD_* secrets (docs/SIGNING.md) for a stable signature.
            MTZ packages built by W Design are unofficial and not verified or signed by Xiaomi.
